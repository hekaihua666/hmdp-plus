worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 前端静态资源：容器内 /usr/share/nginx/html 由 compose 挂载项目里的 nginx html 目录
        location / {
            root   /usr/share/nginx/html/hmdp;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        # 带 /api 前缀的请求转发给后端（后端在 backend 容器里，8081）
        location /api {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            rewrite /api(/.*) $1 break;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://backend:8081;
        }

        # 兼容旧前端页面里不带 /api 前缀的后端接口
        location ~ ^/(shop|shop-type|voucher|voucher-order|blog|user|follow|upload)(/|$) {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://backend:8081;
        }
    }
}
