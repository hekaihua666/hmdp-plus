# IDEA runs on Windows; advertise the mapped localhost port.
brokerClusterName=HmdpLocalCluster
brokerName=hmdp-broker
brokerId=0
brokerIP1=127.0.0.1
listenPort=10911
brokerRole=ASYNC_MASTER
flushDiskType=SYNC_FLUSH
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=true
diskMaxUsedSpaceRatio=95
# 本机Docker可见整台宿主机内存；显式缩小后台资源占用。
mappedFileSizeCommitLog=67108864
mappedFileSizeConsumeQueue=300000
transientStorePoolEnable=false
