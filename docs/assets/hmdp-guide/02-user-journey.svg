<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="333.74,80.9 373.74,80.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
