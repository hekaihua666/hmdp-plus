<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1018.9159999999999 600" width="1018.9159999999999" height="600" style="--bg:#ffffff;--fg:#17345c;--line:#607d9f;--accent:#2a8a76;--muted:#39516c;--surface:#edf4fb;--border:#7094ba;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Microsoft%20YaHei:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="U" x1="70" y1="70" x2="70" y2="570" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="A" x1="210" y1="70" x2="210" y2="570" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="363.6075" y1="70" x2="363.6075" y2="570" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="T" x1="513.1395" y1="70" x2="513.1395" y2="570" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R" x1="653.1395" y1="70" x2="653.1395" y2="570" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Q" x1="793.1395" y1="70" x2="793.1395" y2="570" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="C" x1="934.891" y1="70" x2="934.891" y2="570" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="U" data-to="A" data-label="申请抢购" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="90" x2="210" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">申请抢购</text>
</g>
<g class="message" data-from="A" data-to="R" data-label="只读预检" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="130" x2="653.1395" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="431.56975" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">只读预检</text>
</g>
<g class="message" data-from="A" data-to="D" data-label="提交 INIT 申请" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="170" x2="363.6075" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="286.80375000000004" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">提交 INIT 申请</text>
</g>
<g class="message" data-from="A" data-to="U" data-label="返回申请编号，尚未落单" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="210" x2="70" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回申请编号，尚未落单</text>
</g>
<g class="message" data-from="T" data-to="D" data-label="独立提交 UNKNOWN 预占意图" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="513.1395" y1="250" x2="363.6075" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="438.37350000000004" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">独立提交 UNKNOWN 预占意图</text>
</g>
<g class="message" data-from="T" data-to="R" data-label="幂等预占" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="513.1395" y1="290" x2="653.1395" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="583.1395" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">幂等预占</text>
</g>
<g class="message" data-from="T" data-to="D" data-label="记录 READY 与 HELD" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="513.1395" y1="330" x2="363.6075" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="438.37350000000004" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">记录 READY 与 HELD</text>
</g>
<g class="message" data-from="T" data-to="Q" data-label="发送固定身份消息" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="513.1395" y1="370" x2="793.1395" y2="370" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="653.1395" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">发送固定身份消息</text>
</g>
<g class="message" data-from="Q" data-to="C" data-label="投递下单通知" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="793.1395" y1="410" x2="934.891" y2="410" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="864.0152499999999" y="400" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">投递下单通知</text>
</g>
<g class="message" data-from="C" data-to="D" data-label="同事务扣库存、写订单、标成功" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="934.891" y1="450" x2="363.6075" y2="450" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="649.24925" y="440" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">同事务扣库存、写订单、标成功</text>
</g>
<g class="message" data-from="U" data-to="A" data-label="查询申请状态" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="490" x2="210" y2="490" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="480" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">查询申请状态</text>
</g>
<g class="message" data-from="A" data-to="U" data-label="SUCCEEDED 才显示抢购成功" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="530" x2="70" y2="530" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="520" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">SUCCEEDED 才显示抢购成功</text>
</g>
<g class="actor" data-id="U" data-label="用户" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="70" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">用户</text>
</g>
<g class="actor" data-id="A" data-label="HTTP 入口" data-type="participant">
  <rect x="159.3095" y="30" width="101.381" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="210" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">HTTP 入口</text>
</g>
<g class="actor" data-id="D" data-label="MySQL 申请表" data-type="participant">
  <rect x="300.69050000000004" y="30" width="125.834" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="363.6075" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">MySQL 申请表</text>
</g>
<g class="actor" data-id="T" data-label="后台任务" data-type="participant">
  <rect x="466.5245" y="30" width="93.22999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="513.1395" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">后台任务</text>
</g>
<g class="actor" data-id="R" data-label="Redis Lua" data-type="participant">
  <rect x="606.154" y="30" width="93.971" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="653.1395" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Redis Lua</text>
</g>
<g class="actor" data-id="Q" data-label="RocketMQ" data-type="participant">
  <rect x="745.413" y="30" width="95.453" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="793.1395" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">RocketMQ</text>
</g>
<g class="actor" data-id="C" data-label="落单消费者" data-type="participant">
  <rect x="880.866" y="30" width="108.05" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="934.891" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">落单消费者</text>
</g>
</svg>