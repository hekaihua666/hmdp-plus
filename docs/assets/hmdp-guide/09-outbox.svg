  <text x="566.615" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">同步发送 shopId 与发送版本</text>
</g>
<g class="message" data-from="T" data-to="M" data-label="按 revision 确认为 SENT" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="496.615" y1="290" x2="216.615" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="356.615" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">按 revision 确认为 SENT</text>
</g>
<g class="message" data-from="Q" data-to="C" data-label="投递门店同步通知" data-line-style="solid" data-arrow-head="filled" data-self="false">
