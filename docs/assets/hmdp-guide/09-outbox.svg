</g>
<g class="message" data-from="C" data-to="E" data-label="external_gte 覆盖写" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="935.3085" y1="410" x2="782.8125" y2="410" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="859.0605" y="400" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">external_gte 覆盖写</text>
</g>
<g class="message" data-from="E" data-to="C" data-label="成功或旧版本 409" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="782.8125" y1="450" x2="935.3085" y2="450" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="859.0605" y="440" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">成功或旧版本 409</text>
</g>
<g class="actor" data-id="B" data-label="商户后台" data-type="participant">
