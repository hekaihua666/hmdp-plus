<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 586.467 390" width="586.467" height="390" style="--bg:#ffffff;--fg:#17345c;--line:#607d9f;--accent:#2a8a76;--muted:#39516c;--surface:#edf4fb;--border:#7094ba;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Microsoft%20YaHei:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="A" x1="74.7625" y1="70" x2="74.7625" y2="360" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="214.7625" y1="70" x2="214.7625" y2="360" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="B" x1="354.7625" y1="70" x2="354.7625" y2="360" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="E" x1="497.996" y1="70" x2="497.996" y2="360" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="A" data-to="D" data-label="读取旧数据与版本 V" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="74.7625" y1="90" x2="214.7625" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="144.7625" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">读取旧数据与版本 V</text>
</g>
<g class="message" data-from="D" data-to="D" data-label="商户更新，版本变为 V+1" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="214.7625,130 244.7625,130 244.7625,150 214.7625,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="252.7625" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">商户更新，版本变为 V+1</text>
</g>
<g class="message" data-from="B" data-to="D" data-label="读取新数据与版本 V+1" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="354.7625" y1="200" x2="214.7625" y2="200" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="284.7625" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">读取新数据与版本 V+1</text>
</g>
<g class="message" data-from="B" data-to="E" data-label="写入 V+1，成功" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="354.7625" y1="240" x2="497.996" y2="240" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="426.37924999999996" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">写入 V+1，成功</text>
</g>
<g class="message" data-from="A" data-to="E" data-label="迟到写入 V" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="74.7625" y1="280" x2="497.996" y2="280" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="286.37925" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">迟到写入 V</text>
</g>
<g class="message" data-from="E" data-to="A" data-label="409，保留新数据" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="497.996" y1="320" x2="74.7625" y2="320" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="286.37925" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">409，保留新数据</text>
</g>
<g class="actor" data-id="A" data-label="消费者 A" data-type="participant">
  <rect x="30" y="30" width="89.525" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="74.7625" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">消费者 A</text>
</g>
<g class="actor" data-id="D" data-label="MySQL" data-type="participant">
  <rect x="174.7625" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="214.7625" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">MySQL</text>
</g>
<g class="actor" data-id="B" data-label="消费者 B" data-type="participant">
  <rect x="310" y="30" width="89.525" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="354.7625" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">消费者 B</text>
</g>
<g class="actor" data-id="E" data-label="Elasticsearch" data-type="participant">
  <rect x="439.525" y="30" width="116.94200000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="497.996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Elasticsearch</text>
</g>
</svg>