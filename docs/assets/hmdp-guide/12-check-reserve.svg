<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365.29999999999995 682.8999999999999" width="365.29999999999995" height="682.8999999999999" style="--bg:#ffffff;--fg:#17345c;--line:#607d9f;--accent:#2a8a76;--muted:#39516c;--surface:#edf4fb;--border:#7094ba;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Microsoft%20YaHei:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="182.64999999999998,68.9 182.64999999999998,108.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="返回 0" points="182.64999999999998,145.8 182.64999999999998,246.10000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="182.64999999999998,283 182.64999999999998,323" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="182.64999999999998,359.9 182.64999999999998,399.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="E" data-to="F" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="182.64999999999998,436.79999999999995 182.64999999999998,476.79999999999995" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="F" data-to="G" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="确认成功" points="182.64999999999998,513.6999999999999 182.64999999999998,613.9999999999999" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="B" data-to="C" data-label="返回 0">
  <rect x="157.64999999999998" y="180.8" width="49.132" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="182.21599999999998" y="195.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">返回 0</text>
</g>
<g class="edge-label" data-from="F" data-to="G" data-label="确认成功">
  <rect x="149.64999999999998" y="548.6999999999999" width="65.17" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="182.23499999999999" y="563.8499999999999" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">确认成功</text>
</g>
<g class="node" data-id="A" data-label="HTTP 请求：券与登录校验" data-shape="rectangle">
  <rect x="76.08949999999999" y="32" width="213.12099999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.64999999999998" y="50.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">HTTP 请求：券与登录校验</text>
</g>
<g class="node" data-id="B" data-label="check：只读检查时间、库存和用户归属" data-shape="rectangle">
  <rect x="32" y="108.9" width="301.29999999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.64999999999998" y="127.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">check：只读检查时间、库存和用户归属</text>
</g>
<g class="node" data-id="C" data-label="生成 orderId，提交 INIT 申请" data-shape="rectangle">
  <rect x="72.3845" y="246.10000000000002" width="220.53099999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.64999999999998" y="264.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">生成 orderId，提交 INIT 申请</text>
</g>
<g class="node" data-id="D" data-label="后台 T1：提交 UNKNOWN 意图" data-shape="rectangle">
  <rect x="68.309" y="323" width="228.68199999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.64999999999998" y="341.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">后台 T1：提交 UNKNOWN 意图</text>
</g>
<g class="node" data-id="E" data-label="后台 T2：重查申请状态" data-shape="rectangle">
  <rect x="85.72249999999998" y="399.9" width="193.855" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.64999999999998" y="418.34999999999997" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">后台 T2：重查申请状态</text>
</g>
<g class="node" data-id="F" data-label="reserve：按 orderId 幂等预占" data-shape="rectangle">
  <rect x="68.30899999999998" y="476.79999999999995" width="228.682" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.64999999999998" y="495.24999999999994" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">reserve：按 orderId 幂等预占</text>
</g>
<g class="node" data-id="G" data-label="记录 READY 与 HELD" data-shape="rectangle">
  <rect x="96.09649999999999" y="613.9999999999999" width="173.10699999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.64999999999998" y="632.4499999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">记录 READY 与 HELD</text>
</g>
</svg>