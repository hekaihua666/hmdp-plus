<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 457.3595 532" width="457.3595" height="532" style="--bg:#ffffff;--fg:#17345c;--line:#607d9f;--accent:#2a8a76;--muted:#39516c;--surface:#edf4fb;--border:#7094ba;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Microsoft%20YaHei:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="alt" data-label="收到预占成功">
  <rect x="30" y="238" width="397.3595" height="244" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="238" width="117.31" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="36" y="247" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [收到预占成功]</text>
  <line x1="30" y1="386" x2="427.3595" y2="386" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="38" y="400" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[预占响应未知或后续异常]</text>
</g>
<line class="lifeline" data-actor="W" x1="97.3595" y1="70" x2="97.3595" y2="502" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="237.3595" y1="70" x2="237.3595" y2="502" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R" x1="377.3595" y1="70" x2="377.3595" y2="502" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="W" data-to="D" data-label="BEGIN T1，锁申请并写 UNKNOWN" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="97.3595" y1="90" x2="237.3595" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="167.3595" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">BEGIN T1，锁申请并写 UNKNOWN</text>
</g>
<g class="message" data-from="D" data-to="W" data-label="COMMIT T1，释放行锁" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="237.3595" y1="130" x2="97.3595" y2="130" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="167.3595" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">COMMIT T1，释放行锁</text>
</g>
<g class="message" data-from="W" data-to="D" data-label="BEGIN T2，重新锁行和检查状态" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="97.3595" y1="170" x2="237.3595" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="167.3595" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">BEGIN T2，重新锁行和检查状态</text>
</g>
<g class="message" data-from="W" data-to="R" data-label="reserve，同一 orderId" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="97.3595" y1="210" x2="377.3595" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="237.35950000000003" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">reserve，同一 orderId</text>
</g>
<g class="message" data-from="R" data-to="W" data-label="返回 0" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="377.3595" y1="278" x2="97.3595" y2="278" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="237.35950000000003" y="268" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回 0</text>
</g>
<g class="message" data-from="W" data-to="D" data-label="保存 READY 与 HELD" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="97.3595" y1="318" x2="237.3595" y2="318" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="167.3595" y="308" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">保存 READY 与 HELD</text>
</g>
<g class="message" data-from="D" data-to="W" data-label="COMMIT T2" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="237.3595" y1="358" x2="97.3595" y2="358" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="167.3595" y="348" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">COMMIT T2</text>
</g>
<g class="message" data-from="W" data-to="D" data-label="ROLLBACK T2" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="97.3595" y1="422" x2="237.3595" y2="422" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="167.3595" y="412" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">ROLLBACK T2</text>
</g>
<g class="message" data-from="D" data-to="W" data-label="保留 T1 已提交的 UNKNOWN" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="237.3595" y1="462" x2="97.3595" y2="462" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="167.3595" y="452" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">保留 T1 已提交的 UNKNOWN</text>
</g>
<g class="actor" data-id="W" data-label="后台 prepare" data-type="participant">
  <rect x="39.99999999999999" y="30" width="114.71900000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="97.3595" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">后台 prepare</text>
</g>
<g class="actor" data-id="D" data-label="MySQL" data-type="participant">
  <rect x="197.3595" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="237.3595" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">MySQL</text>
</g>
<g class="actor" data-id="R" data-label="Redis" data-type="participant">
  <rect x="337.3595" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="377.3595" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Redis</text>
</g>
</svg>