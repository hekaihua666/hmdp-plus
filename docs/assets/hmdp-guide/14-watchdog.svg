<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465.74 470" width="465.74" height="470" style="--bg:#ffffff;--fg:#17345c;--line:#607d9f;--accent:#2a8a76;--muted:#39516c;--surface:#edf4fb;--border:#7094ba;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Microsoft%20YaHei:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="T" x1="84.025" y1="70" x2="84.025" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="W" x1="246.895" y1="70" x2="246.895" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R" x1="395.74" y1="70" x2="395.74" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="T" data-to="R" data-label="lock，持有者计数与租期" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="84.025" y1="90" x2="395.74" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="239.8825" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">lock，持有者计数与租期</text>
</g>
<g class="message" data-from="R" data-to="T" data-label="获取成功" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="395.74" y1="130" x2="84.025" y2="130" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="239.8825" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">获取成功</text>
</g>
<g class="message" data-from="T" data-to="W" data-label="无显式租期，安排续期" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="84.025" y1="170" x2="246.895" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="165.46" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">无显式租期，安排续期</text>
</g>
<g class="message" data-from="W" data-to="R" data-label="校验持有者，延长 TTL" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="246.895" y1="210" x2="395.74" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="321.3175" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">校验持有者，延长 TTL</text>
</g>
<g class="message" data-from="R" data-to="W" data-label="续期成功，安排下轮" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="395.74" y1="250" x2="246.895" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="321.3175" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">续期成功，安排下轮</text>
</g>
<g class="message" data-from="T" data-to="T" data-label="完成库存初始化" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="84.025,290 114.025,290 114.025,310 84.025,310" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="122.025" y="300" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">完成库存初始化</text>
</g>
<g class="message" data-from="T" data-to="R" data-label="unlock，校验持有者并释放" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="84.025" y1="360" x2="395.74" y2="360" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="239.8825" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">unlock，校验持有者并释放</text>
</g>
<g class="message" data-from="T" data-to="W" data-label="取消对应续期登记" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="84.025" y1="400" x2="246.895" y2="400" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="165.46" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">取消对应续期登记</text>
</g>
<g class="actor" data-id="T" data-label="初始化线程" data-type="participant">
  <rect x="30.000000000000007" y="30" width="108.05" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="84.025" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">初始化线程</text>
</g>
<g class="actor" data-id="W" data-label="客户端续期任务" data-type="participant">
  <rect x="178.05" y="30" width="137.69" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="246.895" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">客户端续期任务</text>
</g>
<g class="actor" data-id="R" data-label="Redis" data-type="participant">
  <rect x="355.74" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="395.74" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Redis</text>
</g>
</svg>