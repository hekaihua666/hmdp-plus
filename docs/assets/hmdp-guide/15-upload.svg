<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 609.4449999999999 590" width="609.4449999999999" height="590" style="--bg:#ffffff;--fg:#17345c;--line:#607d9f;--accent:#2a8a76;--muted:#39516c;--surface:#edf4fb;--border:#7094ba;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Microsoft%20YaHei:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="B" x1="70" y1="70" x2="70" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="N" x1="210" y1="70" x2="210" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="J" x1="353.2875" y1="70" x2="353.2875" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="F" x1="518.01" y1="70" x2="518.01" y2="560" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="B" data-to="N" data-label="POST 上传 FormData" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="90" x2="210" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">POST 上传 FormData</text>
</g>
<g class="message" data-from="N" data-to="J" data-label="转发到 /upload/blog" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="130" x2="353.2875" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="281.64375" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">转发到 /upload/blog</text>
</g>
<g class="message" data-from="J" data-to="F" data-label="UUID 命名与两级目录落盘" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="353.2875" y1="170" x2="518.01" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="435.64875" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">UUID 命名与两级目录落盘</text>
</g>
<g class="message" data-from="F" data-to="J" data-label="文件保存完成" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="518.01" y1="210" x2="353.2875" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="435.64875" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">文件保存完成</text>
</g>
<g class="message" data-from="J" data-to="N" data-label="返回 /blogs/目录/文件名" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="353.2875" y1="250" x2="210" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="281.64375" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回 /blogs/目录/文件名</text>
</g>
<g class="message" data-from="N" data-to="B" data-label="返回上传结果" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="290" x2="70" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回上传结果</text>
</g>
<g class="message" data-from="B" data-to="B" data-label="路径前补 /imgs，保存笔记地址" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="70,330 100,330 100,350 70,350" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="108" y="340" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">路径前补 /imgs，保存笔记地址</text>
</g>
<g class="message" data-from="B" data-to="N" data-label="GET /imgs/blogs/目录/文件名" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="400" x2="210" y2="400" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">GET /imgs/blogs/目录/文件名</text>
</g>
<g class="message" data-from="N" data-to="F" data-label="读取同一个文件" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="440" x2="518.01" y2="440" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="364.005" y="430" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">读取同一个文件</text>
</g>
<g class="message" data-from="F" data-to="N" data-label="图片内容" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="518.01" y1="480" x2="210" y2="480" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="364.005" y="470" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">图片内容</text>
</g>
<g class="message" data-from="N" data-to="B" data-label="静态图片响应" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="520" x2="70" y2="520" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="510" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">静态图片响应</text>
</g>
<g class="actor" data-id="B" data-label="浏览器" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="70" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">浏览器</text>
</g>
<g class="actor" data-id="N" data-label="Nginx" data-type="participant">
  <rect x="170" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="210" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Nginx</text>
</g>
<g class="actor" data-id="J" data-label="Java 上传接口" data-type="participant">
  <rect x="290" y="30" width="126.57499999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="353.2875" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Java 上传接口</text>
</g>
<g class="actor" data-id="F" data-label="共享静态目录" data-type="participant">
  <rect x="456.575" y="30" width="122.86999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="518.01" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">共享静态目录</text>
</g>
</svg>