# 仅放非敏感MQ默认值；数据库和Redis继续读取本机application.yaml。
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=hmdp-order-producer
rocketmq.producer.send-message-timeout=3000
rocketmq.producer.retry-times-when-send-failed=2
# 故障时限制Redis命令等待，避免一个不可用请求长期占用申请行锁与调度线程。
spring.redis.timeout=${REDIS_COMMAND_TIMEOUT:2s}
hmdp.mq.topic=hmdp-seckill-order
hmdp.mq.consumer-group=hmdp-seckill-order-consumer
hmdp.mq.dlq-consumer-group=hmdp-seckill-order-dlq-handler
hmdp.mq.request-timeout-seconds=${SECKILL_REQUEST_TIMEOUT_SECONDS:600}
hmdp.mq.publish-interval-seconds=${SECKILL_PUBLISH_INTERVAL_SECONDS:60}
# 三条独立任务分别推进预占、发送和超时补偿，慢发送不占用补偿线程。
spring.task.scheduling.pool.size=3
spring.task.scheduling.thread-name-prefix=seckill-
hmdp.mq.prepare-delay-ms=200
hmdp.mq.publish-delay-ms=200
# 商户同步ES的独立主题、消费组和死信消费组；扫描频率单独配置，不与秒杀共用。
hmdp.mq.shop-sync-topic=hmdp-shop-sync
hmdp.mq.shop-sync-consumer-group=hmdp-shop-sync-consumer
hmdp.mq.shop-sync-dlq-consumer-group=hmdp-shop-sync-dlq-handler
hmdp.mq.shop-sync-delay-ms=200
