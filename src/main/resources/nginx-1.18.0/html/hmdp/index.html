<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/main.css" rel="stylesheet">
  <!-- 首页样式最后加载，并带版本号，防止旧布局仍从浏览器缓存中读取。 -->
  <link href="./css/index.css?v=20261012-ui" rel="stylesheet">

  <style type="text/css">
      .el-input__inner {
          border-radius: 20px;
      }
      /* 主页补全下拉：加宽、候选词完整显示不省略 */
      .shop-suggest-popper { min-width: 260px !important; max-width: 90vw; }
      .shop-suggest-popper li { line-height: normal !important; white-space: normal !important; height: auto !important; padding: 8px 14px !important; word-break: break-all; }
  </style>
</head>
<body>
<div id="app" class="home-page" v-cloak>
  <header class="home-header">
    <div class="home-brand-row">
      <div class="home-brand"><span class="brand-icon"><i class="el-icon-discover"></i></span><div><strong>黑马点评</strong><span>发现城市里的好去处</span></div></div>
      <a class="profile-entry" href="/info.html" aria-label="打开我的主页"><i class="el-icon-user"></i></a>
    </div>
  <div class="search-bar">
    <div class="city-btn"><i class="el-icon-location-outline"></i> 杭州</div>
    <div class="search-input">
      <!-- 主页搜索：输入即出补全候选（复用 /shop/suggest），回车或点放大镜带参跳转搜索页 -->
      <el-autocomplete size="small" placeholder="搜索店名、商圈或拼音" clearable
        v-model.trim="keyword"
        :fetch-suggestions="querySuggest"
        :popper-append-to-body="true"
        popper-class="shop-suggest-popper"
        @select="onSuggestSelect"
        @keyup.enter.native="toSearch">
        <i slot="prefix" class="el-input__icon el-icon-search" @click="toSearch"></i>
      </el-autocomplete>
    </div>
    <button class="search-submit" @click="toSearch">搜索</button>
  </div>
  </header>
  <!-- 分类与笔记共用一个滚动区域，向下浏览时分类自然移出屏幕；搜索和底栏留在外面。 -->
  <main class="home-scroll" aria-label="首页内容" @scroll="onScroll">
  <nav class="type-list" aria-label="店铺分类">
    <button class="type-box" v-for="t in types" :key="t.id" :title="t.name" @click="toShopList(t.id, t.name)">
      <div class="type-view"><img :src="'/imgs/' + t.icon" alt=""></div>
      <div class="type-text">{{t.name}}</div>
    </button>
  </nav>
  <div class="feed-bar"><div><strong>发现笔记<span class="feed-dot"></span></strong><span class="feed-subtitle">{{blogSort==='latest' ? '看看大家最近分享了什么' : '发现更受欢迎的生活灵感'}}</span></div><div class="feed-tabs"><button :class="{selected:blogSort==='latest'}" :aria-pressed="blogSort==='latest'" @click="switchBlogSort('latest')">最新</button><button :class="{selected:blogSort==='hot'}" :aria-pressed="blogSort==='hot'" @click="switchBlogSort('hot')">热门</button></div></div>
  <section class="blog-list" aria-label="探店笔记">
    <article class="blog-box" v-for="b in blogs" :key="b.id">
      <div class="blog-img" @click="toBlogDetail(b)"><img v-if="!b.coverFailed" :src="b.img" alt="笔记封面" loading="lazy" @error="$set(b, 'coverFailed', true)"><div v-else class="cover-placeholder"><i class="el-icon-picture-outline"></i><span>图片暂不可用</span></div></div>
      <div class="blog-title" :title="util.displayText(b.title)" @click="toBlogDetail(b)">{{util.displayText(b.title)}}</div>
      <div class="blog-foot">
        <div class="blog-user-icon"><img :src="b.icon || '/imgs/icons/default-icon.png'" alt=""></div>
        <div class="blog-user-name">{{util.displayText(b.name)}}</div>
        <button class="blog-liked" :class="{liked:b.isLike}" :aria-label="(b.isLike ? '取消点赞' : '点赞')+'：'+util.displayText(b.title)" @click="addLike(b)">
          <svg t="1646634642977" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2187" width="14" height="14">
            <path d="M160 944c0 8.8-7.2 16-16 16h-32c-26.5 0-48-21.5-48-48V528c0-26.5 21.5-48 48-48h32c8.8 0 16 7.2 16 16v448zM96 416c-53 0-96 43-96 96v416c0 53 43 96 96 96h96c17.7 0 32-14.3 32-32V448c0-17.7-14.3-32-32-32H96zM505.6 64c16.2 0 26.4 8.7 31 13.9 4.6 5.2 12.1 16.3 10.3 32.4l-23.5 203.4c-4.9 42.2 8.6 84.6 36.8 116.4 28.3 31.7 68.9 49.9 111.4 49.9h271.2c6.6 0 10.8 3.3 13.2 6.1s5 7.5 4 14l-48 303.4c-6.9 43.6-29.1 83.4-62.7 112C815.8 944.2 773 960 728.9 960h-317c-33.1 0-59.9-26.8-59.9-59.9v-455c0-6.1 1.7-12 5-17.1 69.5-109 106.4-234.2 107-364h41.6z m0-64h-44.9C427.2 0 400 27.2 400 60.7c0 127.1-39.1 251.2-112 355.3v484.1c0 68.4 55.5 123.9 123.9 123.9h317c122.7 0 227.2-89.3 246.3-210.5l47.9-303.4c7.8-49.4-30.4-94.1-80.4-94.1H671.6c-50.9 0-90.5-44.4-84.6-95l23.5-203.4C617.7 55 568.7 0 505.6 0z" p-id="2188" :fill="b.isLike ? '#ff6633' : '#82848a'"></path>
          </svg>
          {{b.liked}}
        </button>
      </div>
    </article>
    <div class="feed-state"><span v-if="loadingBlogs">正在加载…</span><span v-else-if="blogsFinished">已经看到全部笔记</span><button v-else @click="queryHotBlogsScroll">加载更多</button></div>
  </section>
  </main>
  <foot-bar :active-btn="1"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js?v=20261012-ui"></script>
<script src="./js/footer.js?v=20261016"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      util,
      isReachBottom: false,
      types: [], // 类型列表
      blogs: [], // 播客列表
      current: 1,// blog的页码
      keyword: "",// 主页搜索关键词
      loadingBlogs: false, // 防止快速滚动重复请求同一页
      blogsFinished: false,
      blogSort: "latest", // 默认让新增的各分类笔记直接可见
      feedVersion: 0,
    },
    created() {
      // 查询类型
      this.queryTypes();
      this.queryHotBlogsScroll();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryHotBlogsScroll() {
        if (this.loadingBlogs || this.blogsFinished) return;
        const version = this.feedVersion;
        this.loadingBlogs = true;
        axios.get("/blog/hot", {params: {current: this.current, sort: this.blogSort}})
          .then(({data}) => {
            if (version !== this.feedVersion) return;
            data.forEach(b => b.img = b.images.split(",")[0]);
            this.blogs = this.blogs.concat(data);
            this.blogsFinished = data.length < 10;
            this.current++; // 只有成功后才前进，失败可以重试同一页
          })
          .catch(err => {
            if (version !== this.feedVersion) return;
            this.$message.error(err)
          }).finally(() => {if (version === this.feedVersion) this.loadingBlogs = false;})
      },
      // 切换排序隔离旧响应，并从第一页开始；热门仍按真实点赞数排序。
      switchBlogSort(sort) {
        if (sort === this.blogSort) return;
        this.feedVersion++; this.blogSort = sort; this.blogs = []; this.current = 1;
        this.blogsFinished = false; this.loadingBlogs = false;
        // 排序重置时回到统一内容区顶部，分类与第一批笔记一同恢复初始位置。
        this.$el.querySelector('.home-scroll').scrollTop = 0;
        this.queryHotBlogsScroll();
      },
      addLike(b) {
        axios.put("/blog/like/" +b.id)
          .then(({data}) => {
            this.queryBlogById(b)
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then(({data}) => {
            b.liked = data.liked;
            b.isLike = data.isLike;
          })
          .catch(() => {
            this.$message.error
            b.liked ++;
          })
      },
      onScroll(e) {
        // 使用分类和笔记的总高度判断触底，继续复用原有分页与重复请求保护。
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if (scrollTop + offsetHeight >= scrollHeight - 40) {
          this.queryHotBlogsScroll();
        }
      },
      toShopList(id, name) {
        location.href = "/shop-list.html?type=" + id + "&name=" + name
      },
      toSearch() {
        // 有关键词则带参跳转，shop-list 会自动走 ES 搜索；无关键词则只跳转页面
        if (this.keyword) {
          location.href = "/shop-list.html?keyword=" + encodeURIComponent(this.keyword);
        } else {
          location.href = "/shop-list.html";
        }
      },
      // 主页补全：调用商户输入补全接口（中文/拼音/首字母均命中，返回中文店名）
      querySuggest(queryString, cb) {
        if (!queryString || !queryString.trim()) { cb([]); return; }
        fetch("/api/shop/suggest?keyword=" + encodeURIComponent(queryString))
          .then(res => res.json())
          .then(res => {
            cb(res.success && res.data ? res.data.map(item => ({ value: util.displayText(item) })) : []);
          })
          .catch(() => cb([]));
      },
      // 选中补全项：把候选词填入关键词并直接跳搜索
      onSuggestSelect(item) {
        this.keyword = item.value;
        this.toSearch();
      },
      toBlogDetail(b) {
        location.href = "/blog-detail.html?id=" + b.id
      }
    }
  })
</script>
</body>
</html>
